<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chemotype Galaxy — 50,000 ChEMBL molecules at 30,000,000-D</title>
<!-- Borrowed from the BloomMap renderer (same vendored, offline d3 + seeded PRNG) -->
<script src="lib/d3.v6.min.js"></script>

<style>
  :root { --ink:#1d1d1f; --paper:#faf8f4; --panel:#ffffff; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: "TeX Gyre Pagella","Palatino Linotype",Palatino,Georgia,serif; }
  #wrap { display:flex; height:100vh; }
  #stage { flex:1 1 auto; position:relative; }
  svg { display:block; width:100%; height:100%; }
  #title { position:absolute; top:18px; left:28px; pointer-events:none; }
  #title h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:0.2px; }
  #title p  { margin:3px 0 0; font-size:12.5px; color:#555; font-style:italic; }
  #legend { position:absolute; left:28px; bottom:22px; font-size:11.5px; color:#333;
    background:rgba(255,255,255,0.72); padding:8px 11px; border-radius:6px; max-width:320px; }
  #legend .row { display:flex; align-items:center; gap:7px; margin:2px 0; }
  #legend .sw { width:13px; height:13px; border-radius:3px; flex:0 0 auto; }
  /* detail panel */
  #panel { flex:0 0 372px; background:var(--panel); border-left:1px solid #e7e2d8;
    padding:20px 22px; overflow-y:auto; box-shadow:-2px 0 14px rgba(0,0,0,0.04); }
  #panel.empty .body { display:none; }
  #panel .hint { color:#888; font-style:italic; font-size:13px; }
  #panel h2 { margin:0 0 2px; font-size:18px; }
  #panel .cls { display:inline-block; font-size:12px; font-weight:700; color:#fff;
    padding:2px 9px; border-radius:11px; margin:6px 0 2px; }
  #panel .ev { font-size:11px; color:#777; font-style:italic; margin:1px 0 12px; }
  #mol { width:100%; height:230px; background:#fcfbf8; border:1px solid #eee;
    border-radius:7px; }
  #panel .kv { font-size:12.5px; margin:8px 0; line-height:1.5; }
  #panel .kv b { color:#444; }
  #panel .use { background:#f3f7f1; border-left:3px solid #4a7a6a; padding:8px 11px;
    border-radius:0 6px 6px 0; font-size:12.5px; margin:12px 0; }
  #panel .use.struct { background:#f7f4ef; border-left-color:#a85a16; }
  #panel .smiles { font-family:"Source Code Pro",ui-monospace,monospace; font-size:10.5px;
    word-break:break-all; color:#555; background:#f7f5f1; padding:7px 9px; border-radius:5px; margin-top:6px; }
  #panel a { color:#2f6f62; }
  #p-members { display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 6px; }
  .mchip { font-family:"Source Code Pro",ui-monospace,monospace; font-size:10px;
    padding:3px 7px; border-radius:5px; background:#f0ede7; border:1px solid #e2ddd3;
    cursor:pointer; color:#555; user-select:none; }
  .mchip:hover { background:#e7f0ec; }
  .mchip.sel { background:#2f6f62; color:#fff; border-color:#2f6f62; font-weight:700; }
  .mchip .ex { color:#c4762a; font-weight:700; }
  .mchip.sel .ex { color:#ffd9a8; }
  .node-leaf { cursor:pointer; }
  .node-leaf:hover { stroke:#1d1d1f; stroke-width:1.6px; }
  .link { fill:none; stroke:#cdc7ba; stroke-opacity:0.7; }
  .ring-label { font-size:10px; fill:#9a9384; }
</style>
</head>

  const cluster = d3.cluster().size([2*Math.PI, R]);
  cluster(root);

  const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);

  // radial depth rings (faint guides, depth -> radius)
  const maxd = data.max_depth;
  for (let dpt=1; dpt<=maxd; dpt++){

    .attr("transform", d => `translate(${toXY(d)})`)
    .attr("r", d => rscale(d.data.size))
    .attr("fill", d => classColor[d.data.structural_class] || "#999")
    .attr("fill-opacity", 0.92).attr("stroke","#fff").attr("stroke-width",1)
    .on("click", (e,d) => select(d.data))
    .on("mouseover", function(){ d3.select(this).raise(); });

  // leaf id labels just outside the rim
  g.selectAll(".leaf-label").data(root.leaves()).join("text")
    .attr("class","ring-label")
    .attr("transform", d => {
      const a = d.x - Math.PI/2, r = d.y + 16;
      const x = Math.cos(a)*r, y = Math.sin(a)*r;
      const deg = d.x*180/Math.PI;
      const rot = (deg<180) ? deg-90 : deg+90;
      return `translate(${x},${y}) rotate(${rot})`;
    })
    .attr("text-anchor", d => (d.x<Math.PI)?"start":"end")
    .text(d => d.data.leaf_id);

  // legend = structural classes
  const lg = d3.select("#legend");
  lg.append("div").style("font-weight","700").style("margin-bottom","4px")
    .text("Structural class (from exemplar SMILES)");
  classes.forEach(c => {
    const row = lg.append("div").attr("class","row");
    row.append("div").attr("class","sw").style("background",classColor[c]);
    row.append("div").text(`${c}  (${data.class_histogram[c]})`);
  });

  // smiles-drawer instance (offline)
  const drawer = new SmiDrawer({ width:744, height:460 });

  let curMembers = [], curIdx = 0;

  function drawMember(i){
    if (!curMembers.length) return;
    curIdx = (i + curMembers.length) % curMembers.length;
    const m = curMembers[curIdx];
    d3.selectAll(".mchip").classed("sel", (_,k)=>k===curIdx);
    d3.select("#p-chembl").html(m.chembl_id
      ? `<b>${curIdx===0?"Exemplar":"Member "+(curIdx+1)}:</b> `
        + `<a href="https://www.ebi.ac.uk/chembl/compound_report_card/${m.chembl_id}/" target="_blank">${m.chembl_id}</a>`
        + (curIdx===0?' <span style="color:#c4762a">(most central)</span>':'')
      : "");
    d3.select("#p-smiles").text(m.smiles || "—");
    const c = document.getElementById("mol");
    c.getContext("2d").clearRect(0,0,c.width,c.height);
    if (m.smiles){ try { drawer.draw(m.smiles, "#mol", "light"); } catch(e){
      c.getContext("2d").fillText("structure could not be drawn", 20, 30); } }
  }

  function select(d){
    d3.select("#panel").classed("empty", false);
    d3.select("#p-leaf").text(`${d.leaf_id} — chemotype cluster`);
    const col = classColor[d.structural_class] || "#999";
    d3.select("#p-class").text(d.structural_class).style("background", col);
    d3.select("#p-ev").text(d.class_evidence ? `structural evidence: ${d.class_evidence}` : "");
    d3.select("#p-stats").html(
      `<b>${(d.n_members||d.size).toLocaleString()}</b> molecules · cohesion lift `
      + `<b>+${(d.log10_lift/1e6).toFixed(2)}×10⁶</b> log₁₀ · `
      + `exemplar cosine <b>${(d.centroid_cosine||0).toFixed(3)}</b>`);
    const useDiv = d3.select("#p-use");
    if (d.known_use){
      useDiv.attr("class","use").html(
        `<b>Known use:</b> ${d.known_use}` + (d.use_source?` <span style="color:#888">(${d.use_source})</span>`:""));
    } else {
      useDiv.attr("class","use struct").html(
        `<b>Type:</b> ${d.structural_class}.`);
    }
    // member list: exemplar first, then up to 9 more. Click/arrow to flip the structure.
    curMembers = (d.members && d.members.length) ? d.members : (d.smiles ? [{chembl_id:d.chembl_id, smiles:d.smiles}] : []);
    const host = d3.select("#p-members"); host.selectAll("*").remove();
    host.selectAll(".mchip").data(curMembers).join("div")
      .attr("class","mchip")
      .html((m,k)=> (k===0?'<span class="ex">★</span> ':'') + (m.chembl_id||"?").replace("CHEMBL",""))
      .on("click",(e,m)=>{ drawMember(curMembers.indexOf(m)); });
    drawMember(0);
  }

  // ◀ ▶ arrows flip through the current cluster's members
  window.addEventListener("keydown", e=>{
    if (!curMembers.length) return;
    if (e.key==="ArrowRight"){ drawMember(curIdx+1); e.preventDefault(); }
    if (e.key==="ArrowLeft"){ drawMember(curIdx-1); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
