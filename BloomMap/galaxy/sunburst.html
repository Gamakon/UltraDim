const W=860, R=W/2;
const svg=d3.select("#sb").attr("width",W).attr("height",W)
  .append("g").attr("transform",`translate(${R},${R})`);

const root=d3.hierarchy(DATA.root)
  .sum(d=>d.is_leaf?d.size:0)        // leaves carry the row mass
  .sort((a,b)=>b.value-a.value);
d3.partition().size([2*Math.PI, R])(root);

// colour by lift, log-scaled across the observed range (warmer = tighter)
const lmin=Math.max(1,DATA.lift_min), lmax=DATA.lift_max;
const liftColor=d3.scaleSequential(d3.interpolateInferno)
  .domain([Math.log10(lmin),Math.log10(lmax)]);
function fill(d){
  const lift=d.data.lift||lmin;
  return liftColor(Math.log10(Math.max(lift,lmin)));
}

const arc=d3.arc()
  .startAngle(d=>d.x0).endAngle(d=>d.x1)
  .innerRadius(d=>d.y0).outerRadius(d=>d.y1).padAngle(.0008);

const tip=d3.select("#tip");
svg.selectAll("path").data(root.descendants().filter(d=>d.depth>0))
  .join("path").attr("class","arc").attr("d",arc).attr("fill",fill)
  .on("mousemove",(e,d)=>{
    tip.style("opacity",1).style("left",(e.clientX+14)+"px").style("top",(e.clientY+12)+"px")
      .html(`<b>${d.data.address}</b><br>level ${d.data.level} · ${d.value.toLocaleString()} rows`
            +`<br>log₁₀ lift ${(d.data.lift||0).toLocaleString(undefined,{maximumFractionDigits:0})}`
            +(d.data.is_leaf?"<br><i>leaf</i>":""));
  })
  .on("mouseout",()=>tip.style("opacity",0));

// centre label = root
svg.append("circle").attr("r",4).attr("fill","#cfd6e4");
d3.select("#legend").html(
  `rings = tree depth (centre = root, outer = level ${DATA.max_level}) &nbsp;·&nbsp; `
 +`arc width = molecules in node &nbsp;·&nbsp; colour = log₁₀ cohesion lift (dark→bright = looser→tighter)`);
